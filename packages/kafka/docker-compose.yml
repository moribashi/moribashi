# Local single-node Redpanda + Console, to back the integration suite.
#
#   docker compose -f packages/kafka/docker-compose.yml up -d
#   KAFKA_INTEGRATION=1 pnpm --filter @moribashi/kafka run test
#   docker compose -f packages/kafka/docker-compose.yml down -v
#
# Console (topics, schemas, messages) is on http://localhost:8080.
#
# `--mode dev-container` turns off the production readiness checks and fsync
# guarantees a single-node dev broker does not need; `--smp 1 --memory 512M`
# keeps it out of the way of everything else in the devcontainer.
name: moribashi-kafka

services:
  redpanda:
    image: redpandadata/redpanda:latest
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr internal://redpanda:8082,external://localhost:18082
      - --smp 1
      - --memory 512M
      - --mode dev-container
      - --default-log-level=warn
      # Matches the real cluster: producing to an unknown topic is an error,
      # not a silent topic creation.
      - --set redpanda.auto_create_topics_enabled=false
    ports:
      - "19092:19092"
      - "18081:18081"
      - "18082:18082"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  console:
    image: redpandadata/console:latest
    depends_on:
      redpanda:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      KAFKA_BROKERS: redpanda:9092
      SCHEMA_REGISTRY_URLS: http://redpanda:8081
      REDPANDA_ADMINAPI_URLS: http://redpanda:9644
