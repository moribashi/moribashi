name: Build & Publish

on:
  push:
    branches: [main]
    tags: ["[0-9]*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 0.2.0)"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: moribashi
          POSTGRES_PASSWORD: password
          POSTGRES_DB: moribashi
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm run build

      - name: Type-check
        run: |
          npx tsc --noEmit -p packages/common/tsconfig.json
          npx tsc --noEmit -p packages/core/tsconfig.json
          npx tsc --noEmit -p packages/cli/tsconfig.json
          npx tsc --noEmit -p packages/web/tsconfig.json
          npx tsc --noEmit -p packages/graphql/tsconfig.json
          npx tsc --noEmit -p packages/kafka/tsconfig.json
          npx tsc --noEmit -p packages/pg/tsconfig.json
          npx tsc --noEmit -p packages/auth/tsconfig.json

      - name: Test
        run: |
          pnpm --filter @moribashi/kafka run test
          pnpm --filter @moribashi/pg run test
          pnpm --filter @moribashi/auth run test
        env:
          PGHOST: localhost

  publish:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Set package versions
        run: |
          VERSION="${{ github.event.inputs.version || github.ref_name }}"
          echo "Publishing version: $VERSION"
          pnpm -r --filter './packages/**' exec npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Build all packages
        run: pnpm run build

      # ── First publish of a NEW package needs a token; everything else uses OIDC
      #
      # Trusted publishing keeps its config on the package's settings page at
      # npmjs.com, so it cannot be configured for a package that does not exist
      # yet (npm/cli#8544 — PyPI has "pending publishers" for this, npm does
      # not). A brand-new package therefore needs token auth exactly once. After
      # that, configure trusted publishing on it and this step stops touching it.
      #
      # Why the ID-token vars are blanked below: when npm attempts OIDC and the
      # registry has no trusted publisher for that package, the request is
      # treated as ANONYMOUS and comes back as a bare `404 Not Found` on the PUT
      # (npm/cli#9088) — which reads like "package missing" and is really "auth
      # rejected". Blanking them keeps npm from trying OIDC at all, so it uses
      # the token in ~/.npmrc. Provenance is off here for the same reason: it is
      # an OIDC feature. Packages that already exist keep both.
      - name: Bootstrap brand-new packages (token auth, no OIDC)
        env:
          NPM_TOKEN: ${{ secrets.TEMP_NPMJS_TOKEN || secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "No bootstrap token available — skipping (OIDC handles existing packages)."
            exit 0
          fi
          echo "//registry.npmjs.org/:_authToken=$NPM_TOKEN" >> ~/.npmrc

          for dir in packages/*/; do
            name=$(node -p "require('./${dir}package.json').name")
            version=$(node -p "require('./${dir}package.json').version")
            if npm view "$name" versions >/dev/null 2>&1; then
              echo "· $name exists — leaving to OIDC"
            else
              echo "· $name is NEW — bootstrapping $version with token auth"
              ( cd "$dir" \
                && ACTIONS_ID_TOKEN_REQUEST_URL= ACTIONS_ID_TOKEN_REQUEST_TOKEN= \
                   npm publish --access public --provenance=false )
            fi
          done

      - name: Publish to npmjs
        run: pnpm -r --filter './packages/**' publish --access public --no-git-checks
