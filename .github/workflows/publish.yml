name: Build & Publish

on:
  push:
    branches: [main]
    tags: ["[0-9]*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 0.2.0)"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: moribashi
          POSTGRES_PASSWORD: password
          POSTGRES_DB: moribashi
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm run build

      - name: Type-check
        run: |
          npx tsc --noEmit -p packages/common/tsconfig.json
          npx tsc --noEmit -p packages/core/tsconfig.json
          npx tsc --noEmit -p packages/cli/tsconfig.json
          npx tsc --noEmit -p packages/web/tsconfig.json
          npx tsc --noEmit -p packages/graphql/tsconfig.json
          npx tsc --noEmit -p packages/kafka/tsconfig.json
          npx tsc --noEmit -p packages/pg/tsconfig.json
          npx tsc --noEmit -p packages/auth/tsconfig.json

      - name: Test
        run: |
          pnpm --filter @moribashi/kafka run test
          pnpm --filter @moribashi/pg run test
          pnpm --filter @moribashi/auth run test
        env:
          PGHOST: localhost

  publish:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Set package versions
        run: |
          VERSION="${{ github.event.inputs.version || github.ref_name }}"
          echo "Publishing version: $VERSION"
          pnpm -r --filter './packages/**' exec npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Build all packages
        run: pnpm run build

      # ── First publish of a NEW package needs a token; everything else uses OIDC
      #
      # Trusted publishing keeps its config on the package's settings page at
      # npmjs.com, so it cannot be configured for a package that does not exist
      # yet (npm/cli#8544 — PyPI has "pending publishers" for this, npm does
      # not). A brand-new package therefore needs token auth exactly once. After
      # that, configure trusted publishing on it and this step stops touching it.
      #
      # Why the ID-token vars are blanked below: when npm attempts OIDC and the
      # registry has no trusted publisher for that package, the request is
      # treated as ANONYMOUS and comes back as a bare `404 Not Found` on the PUT
      # (npm/cli#9088) — which reads like "package missing" and is really "auth
      # rejected". Blanking them keeps npm from trying OIDC at all, so it uses
      # the token in ~/.npmrc. Provenance is off here for the same reason: it is
      # an OIDC feature. Packages that already exist keep both.
      - name: Configure bootstrap token
        env:
          NPM_TOKEN: ${{ secrets.TEMP_NPMJS_TOKEN || secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "No bootstrap token available — OIDC only."
            exit 0
          fi
          echo "//registry.npmjs.org/:_authToken=$NPM_TOKEN" >> ~/.npmrc
          echo "Bootstrap token configured."

      # NOTE on a false alarm, since it will look like a bug next time:
      # a NEWLY CREATED package stays 404 on the public registry and 403 on
      # npmjs.com for a few minutes after a successful publish, while already
      # showing up in `npm access list packages <scope>` (which reads
      # authenticated). It looks exactly like the package landed restricted.
      # It isn't — it's CDN propagation, and it clears on its own. Don't add an
      # `npm access set status=public` step for it: the token gets 403 on
      # packages that are already public, so the "fix" only adds noise.
      #
      # The practical consequence is that the verification step at the end can
      # fail on a package that published seconds earlier. Re-run before
      # investigating.
      - name: Bootstrap brand-new packages (token auth, no OIDC)
        run: |

          # Never abort the run here. A bootstrap needs a token that bypasses
          # 2FA (Classic *Automation*, or a granular token — a Classic "Publish"
          # token fails EOTP asking for a one-time password no CI can supply).
          # If that token is wrong, exactly one package is stuck, and it must not
          # take the other seven down with it: they publish via OIDC and need no
          # token at all. The final step below still fails the run.
          for dir in packages/*/; do
            name=$(node -p "require('./${dir}package.json').name")
            version=$(node -p "require('./${dir}package.json').version")
            if npm view "$name" versions >/dev/null 2>&1; then
              echo "· $name exists — leaving to OIDC"
            else
              echo "· $name is NEW — bootstrapping $version with token auth"
              # pnpm publish, NOT npm publish. Internal deps are declared
              # `@moribashi/core: workspace:*`, and only pnpm rewrites that to a
              # real version on publish. npm ships the literal string, producing
              # a package that installs with:
              #   EUNSUPPORTEDPROTOCOL  Unsupported URL Type "workspace:"
              # It publishes cleanly and is broken for every consumer — and the
              # version can never be reused, so the only fix is a new release.
              # @moribashi/kafka@0.4.0 was lost exactly this way.
              if ( cd "$dir" \
                   && ACTIONS_ID_TOKEN_REQUEST_URL= ACTIONS_ID_TOKEN_REQUEST_TOKEN= \
                      pnpm publish --access public --no-git-checks --no-provenance ); then
                echo "  ✓ $name bootstrapped"
              else
                echo "  ✗ $name could NOT be bootstrapped — continuing so the rest still publish"
              fi
            fi
          done

      # ── Which packages still need a human, and why CI cannot do it ─────────
      #
      # A package bootstrapped by token stays token-dependent until someone
      # configures trusted publishing for it, and nothing announces that it was
      # never done. @moribashi/auth proves the point: new in 0.3.0, bootstrapped
      # by token, never adopted, and it stayed the only package without a
      # provenance attestation for two whole releases — surfacing only when the
      # token grew a 2FA requirement and auth started failing EOTP.
      #
      # There WAS a step here that tried to adopt them automatically with
      # `npm trust github`. It cannot work, by design:
      #
      #   403 POST /-/package/@moribashi%2fauth/trust
      #   "Granular access tokens that bypass two-factor authentication may not
      #    perform this action."
      #
      # Configuring trusted publishing is an account-level security change, so
      # npm requires a human with 2FA — which is exactly the property that makes
      # trusted publishing worth having. A CI token that could grant itself
      # trust would defeat it. So this reports and leaves it to a person.
      - name: Report packages still publishing by token
        run: |
          needs=""
          for dir in packages/*/; do
            name=$(node -p "require('./${dir}package.json').name")
            npm view "$name" versions >/dev/null 2>&1 || continue
            [ -n "$(npm view "$name" dist.attestations 2>/dev/null)" ] && continue
            needs="$needs $name"
          done
          if [ -n "$needs" ]; then
            echo "::warning::Publishing by token, not trusted publishing:$needs"
            echo "Configure at npmjs.com -> Packages -> <package> -> Settings -> Trusted publishing"
            echo "  repository: moribashi/moribashi   workflow: publish.yml"
            echo "Until then these depend on NPM_TOKEN and lose provenance."
          else
            echo "Every package publishes over OIDC with provenance."
          fi

      - name: Publish to npmjs (trusted publishing)
        run: |
          # Exclude anything still missing from the registry. pnpm would try it,
          # get the anonymous-404 that an unconfigured trusted publisher
          # produces, and abort — starving every package that comes after it in
          # the topological order. Self-clearing: once a package exists, nothing
          # is excluded. Packages already at this version are skipped by pnpm.
          filters=""
          for dir in packages/*/; do
            name=$(node -p "require('./${dir}package.json').name")
            if ! npm view "$name" versions >/dev/null 2>&1; then
              echo "excluding $name — not on the registry yet"
              filters="$filters --filter=!$name"
            fi
          done
          pnpm -r --filter './packages/**' $filters publish --access public --no-git-checks

      # The run must go red if the release is incomplete. Publishing seven of
      # eight is a broken lockstep release, not a success — `npm i` of the
      # missing one fails for every consumer.
      - name: Verify every package published
        run: |
          # Retry, because a package is not readable the instant it publishes.
          # Without this the step reports packages as MISSING seconds after they
          # went out — it did exactly that for auth and pg on the 0.4.1 run, both
          # of which were live a minute later. A false red on a release that
          # actually succeeded is worse than a slow green: it invites someone to
          # "fix" a publish that already worked.
          for attempt in 1 2 3 4 5 6; do
            missing=""
            for dir in packages/*/; do
              name=$(node -p "require('./${dir}package.json').name")
              version=$(node -p "require('./${dir}package.json').version")
              npm view "$name@$version" version >/dev/null 2>&1 || missing="$missing $name@$version"
            done
            [ -z "$missing" ] && break
            echo "attempt $attempt — still settling:$missing"
            [ "$attempt" -lt 6 ] && sleep 30
          done

          if [ -n "$missing" ]; then
            echo "::error::Release incomplete — unpublished:$missing"
            exit 1
          fi
          for dir in packages/*/; do
            name=$(node -p "require('./${dir}package.json').name")
            version=$(node -p "require('./${dir}package.json').version")
            echo "✓ $name@$version"
          done
          echo "All packages published."
